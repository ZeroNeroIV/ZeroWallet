name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize release runs: each run bumps package.json and pushes it back,
# so overlapping runs would conflict on push.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Bump the patch version once per triggered build so every published APK
  # has a fresh versionName, and use the monotonic run number as versionCode
  # so Android accepts it as an upgrade over any previous install.
  version:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      versionCode: ${{ steps.bump.outputs.versionCode }}
      tag: ${{ steps.bump.outputs.tag }}
      name: ${{ steps.bump.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          NEW_VERSION=$(node -p "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const v=p.version.split('.').map(Number);v[2]+=1;p.version=v.join('.');fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');p.version")
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "versionCode=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=v${NEW_VERSION} (${SHORT_SHA})" >> $GITHUB_OUTPUT

      # Push the bumped package.json back so the repo version stays in sync.
      # [skip ci] avoids triggering a new run (would loop forever otherwise).
      # autostash handles any working-tree changes during the rebase.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git -c rebase.autoStash=true pull --rebase origin main
          git add package.json
          git commit -m "ci: bump version to ${{ steps.bump.outputs.version }} [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main || echo "version push skipped"

  # Single build job for ALL phone ABIs: one gradle invocation emits one
  # small per-ABI APK per architecture (~30-48MB each) via ABI splits.
  # NOTE: do NOT fan this out into a matrix with artifact upload/download —
  # mixing split outputs across jobs produced structurally corrupt APKs
  # (central-directory/local-header mismatches → INSTALL_PARSE_FAILED on
  # device). Keep build + publish in this one job.
  build:
    name: Build & Publish APKs
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Release APKs
        run: >
          cd android && ./gradlew assembleRelease
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          -PappVersionCode=${{ needs.version.outputs.versionCode }}
          -PappVersionName=${{ needs.version.outputs.version }}
          --no-daemon

      # Structural integrity gate: every zip entry's central-directory
      # record must match its local header. A mismatch means the v2
      # signature digests cannot verify and Android rejects the APK with
      # INSTALL_PARSE_FAILED_NO_CERTIFICATES ("invalid package").
      - name: Verify APK integrity
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import zipfile

          failed = False
          apks = sorted(glob.glob('android/app/build/outputs/apk/release/*.apk'))
          assert apks, 'no APKs found'
          for path in apks:
              print('checking', path)
              with zipfile.ZipFile(path) as z:
                  for info in z.infolist():
                      try:
                          with z.open(info.filename) as f:
                              f.read(1)
                      except Exception as ex:
                          print('CORRUPT ENTRY:', info.filename, '->', ex)
                          failed = True
          if failed:
              print('APK INTEGRITY CHECK FAILED')
              sys.exit(1)
          print('all APK entries structurally sound')
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.name }}
          body: |
            **Version:** ${{ needs.version.outputs.version }} (versionCode ${{ needs.version.outputs.versionCode }})
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}
            **APKs:** per-ABI builds — pick the one matching your phone: `app-arm64-v8a-release.apk` (modern phones, e.g. HONOR X9a) or `app-armeabi-v7a-release.apk` (older 32-bit phones). Installs as a normal upgrade; only uninstall first if you get a signature error (happens when the old app came from a local build).
          files: android/app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
