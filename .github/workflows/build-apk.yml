name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      architectures:
        description: 'ABIs to build (comma-separated phone ABIs)'
        default: 'armeabi-v7a,arm64-v8a'
        required: false

# Serialize release runs: each run bumps package.json and pushes it back,
# so overlapping runs would conflict on push.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      # Bump the patch version on every triggered build so each published
      # APK has a fresh versionName, and use the monotonic run number as
      # versionCode so Android accepts it as an upgrade over any previous
      # install (this is what was blocking installs before).
      - name: Bump version
        id: version
        run: |
          NEW_VERSION=$(node -p "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const v=p.version.split('.').map(Number);v[2]+=1;p.version=v.join('.');fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');p.version")
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "versionCode=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=v${NEW_VERSION} (${SHORT_SHA})" >> $GITHUB_OUTPUT

      # Per-ABI build: one small APK per architecture instead of a fat
      # universal APK (~120MB), and only phone ABIs are compiled so the
      # native build is much faster. Install the APK matching your phone
      # (arm64-v8a on modern phones, armeabi-v7a on older 32-bit ones).
      - name: Build Release APK
        run: |
          ARCHS="${{ inputs.architectures }}"
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=${ARCHS:-armeabi-v7a,arm64-v8a} -PappVersionCode=${{ steps.version.outputs.versionCode }} -PappVersionName=${{ steps.version.outputs.version }} --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.name }}
          body: |
            **Version:** ${{ steps.version.outputs.version }} (versionCode ${{ steps.version.outputs.versionCode }})
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}
            **APKs:** per-ABI builds (~30MB each) — pick the one matching your phone: `app-arm64-v8a-release.apk` (modern phones) or `app-armeabi-v7a-release.apk` (older 32-bit phones). If install fails, uninstall the old app first (signing key changed).
          files: android/app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true

      # Push the bumped package.json back so the repo version stays in sync.
      # [skip ci] avoids triggering a new run (would loop forever otherwise).
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add package.json
          git commit -m "ci: bump version to ${{ steps.version.outputs.version }} [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main || echo "version push skipped"
